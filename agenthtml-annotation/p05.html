.out header .sp{flex:1}

.progress{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TYPE_TEXT = {1: '同一任务、同一生成方法，不同模型', 2: '同一任务、同一模型，三种生成方法'};
// multi-select: an annotator ticks every report they consider good (hm, 2026-09-23)
const DOMAIN = {daily_web_tasks:'日常网页任务', tool_use_customer_service:'工具调用 · 客服', data_analysis:'数据分析', terminal_devops:'终端 / DevOps', code_repair:'代码修复', desktop_gui:'桌面 GUI'};
const app = $('#app');
let S = null;             // session: {annotator, packet, ids, answers:{qid:{rank:{}, comment, seconds}}, i}
let openedAt = 0;
const storeKey = () => `agenthtml-annot-multi-v2:${S.annotator}:${S.packet}`;
function save(){ try{ localStorage.setItem(storeKey(), JSON.stringify(S)); }catch(e){} }
function load(annotator, packet){ try{ const v = localStorage.getItem(`agenthtml-annot-multi-v2:${annotator}:${packet}`); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
const byId = Object.fromEntries(DATA.questions.map(q => [q.id, q]));
const packetCodes = Object.keys(DATA.packets);

function renderStart(){
  const preview = packetCodes.length === 0;
  app.innerHTML = `
  <div class="start">
    <div>
      <h1>AgentHTML 报告排序标注</h1>
      <p>每一题给出一个 agent 任务，以及几份由不同模型或不同生成方法写出的 HTML 报告。把你<b>觉得好的报告都勾上</b>（可以只勾一份，也可以全勾）：好的标准是它能让你看懂这次任务做了什么、做得怎么样、结果可不可信。</p>
      <p class="hint">报告以 A、B、C… 匿名显示。每份报告可以在框内滚动，也可以点「放大」单独看。只看报告本身，不要猜它出自哪个模型。</p>
    </div>
    <div class="card">
      <label for="annotator">标注者编号（发给你的编号，例如 A3）</label>
      <input type="text" id="annotator" placeholder="A3" autocomplete="off">
      <div style="height:10px"></div>
      <label for="packet">题包</label>
      ${preview ? `<select id="packet"><option value="__all__">预览模式：全部 ${DATA.questions.length} 题（题包尚未分配）</option></select>`
                : `<select id="packet">${packetCodes.map(c => `<option value="${esc(c)}">${esc(c)}（${DATA.packets[c].length} 题）</option>`).join('')}</select>`}
      <div style="height:14px"></div>
      <button class="primary" id="go">开始标注</button>
      <p class="hint" style="margin-top:10px">进度会保存在这台电脑的浏览器里；同一编号、同一题包再次打开会接着上次的位置。</p>
    </div>
  </div>`;
  $('#go').onclick = () => {
    const annotator = $('#annotator').value.trim();
    if(!annotator){ $('#annotator').focus(); return; }
    const packet = $('#packet').value;
    const ids = packet === '__all__' ? DATA.questions.map(q => q.id) : DATA.packets[packet];
    S = load(annotator, packet) || {annotator, packet, ids, answers:{}, i:0, started: new Date().toISOString()};
    save(); renderQuestion();
  };
}

function renderQuestion(){
  const qid = S.ids[S.i], q = byId[qid];
  const a = S.answers[qid] || (S.answers[qid] = {good:[], comment:'', seconds:0});
  const n = q.outputs.length;
  openedAt = Date.now();
  app.innerHTML = `
  <div class="top">
    <span class="mono">${esc(S.annotator)} · ${esc(S.packet === '__all__' ? '预览' : S.packet)}</span>
    <span>第 <b>${S.i+1}</b> / ${S.ids.length} 题</span>
    <span class="badge">类型 ${q.type}</span><span class="hint">${TYPE_TEXT[q.type]}</span>
    <span class="hint mono">${esc(q.id)}</span>
  </div>
  <div class="task">
    <span class="badge">${esc(DOMAIN[q.domain] || q.domain)}</span>
    <div class="q">${esc(q.task_summary)}</div>
    <div class="fixed">${esc(q.fixed)} · 下面 ${n} 份报告，觉得好的就勾上，可以勾一份也可以全勾</div>
  </div>
  <div class="grid" style="--cols:${Math.min(n,3)}">
    ${q.outputs.map(o => `
    <div class="out" data-label="${o.label}">
      <header><span class="letter">${o.label}</span><span class="sp"></span><button class="zoom" data-label="${o.label}">放大</button></header>
      <iframe src="${esc(o.file)}" title="报告 ${o.label}" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
      <div class="ranks"><button class="rk tick${a.good.includes(o.label)?' on':''}" data-label="${o.label}">${a.good.includes(o.label)?'✓ 好':'好'}</button></div>
    </div>`).join('')}
  </div>
  <div class="summary" id="summary"></div>
  <div>
    <label for="comment">备注（可选：为什么这样排，或哪份有明显问题）</label>
    <textarea id="comment">${esc(a.comment)}</textarea>
  </div>
  <div class="progress" id="progress"></div>
  <div class="nav">
    <button id="prev" ${S.i===0?'disabled':''}>上一题</button>
    <button id="next" class="primary">${S.i===S.ids.length-1 ? '完成，生成结果' : '下一题'}</button>
    <span class="sp"></span>
    <button id="finish">随时生成结果</button>
    <button id="quit">退出</button>
  </div>`;
  app.querySelectorAll('.rk').forEach(b => b.onclick = () => { const l = b.dataset.label; a.good = a.good.includes(l) ? a.good.filter(x => x !== l) : [...a.good, l].sort(); save(); app.querySelectorAll('.rk').forEach(x => { const on = a.good.includes(x.dataset.label); x.classList.toggle('on', on); x.textContent = on ? '✓ 好' : '好'; }); paintSummary(q, a); paintProgress(); });
  app.querySelectorAll('.zoom').forEach(b => b.onclick = () => {
    const card = b.closest('.out'); const big = card.classList.toggle('big'); b.textContent = big ? '还原' : '放大';
    if(big) card.scrollIntoView({behavior:'smooth', block:'start'});
  });
  $('#comment').oninput = e => { a.comment = e.target.value; save(); };
  $('#prev').onclick = () => { commitTime(a); S.i--; save(); renderQuestion(); };
  $('#next').onclick = () => { commitTime(a); if(S.i === S.ids.length-1){ save(); renderResult(); } else { S.i++; save(); renderQuestion(); } };
  $('#finish').onclick = () => { commitTime(a); save(); renderResult(); };
  $('#quit').onclick = () => { commitTime(a); save(); S = null; renderStart(); };
  paintSummary(q, a); paintProgress();
}

const complete = (q, a) => a.visited === true;
function paintSummary(q, a){
  const n = a.good.length;
  $('#summary').innerHTML = `<span class="order">${n ? '勾了：' + a.good.join('、') : '还没勾'}</span>` +
    `<span class="pill ${n && n < q.outputs.length ? 'ok' : 'warn'}">${n === 0 ? '一份都没勾也可以，表示都不好' : (n === q.outputs.length ? '全勾了，表示都差不多好' : n + ' / ' + q.outputs.length)}</span>`;
}
function paintProgress(){
  $('#progress').innerHTML = S.ids.map((id, k) => { const done = S.answers[id] && complete(byId[id], S.answers[id]);
    return `<button class="${done?'done':''}${k===S.i?' cur':''}" data-i="${k}" title="${esc(id)}">${k+1}</button>`; }).join('');
  app.querySelectorAll('#progress button').forEach(b => b.onclick = () => { const cur = S.answers[S.ids[S.i]]; if(cur) commitTime(cur); S.i = +b.dataset.i; save(); renderQuestion(); });
}
function commitTime(a){ a.seconds = Math.round((a.seconds || 0) + (Date.now() - openedAt)/1000); openedAt = Date.now(); a.visited = true; }

function renderResult(){
  const rows = S.ids.map(id => { const q = byId[id], a = S.answers[id] || {good:[], comment:'', seconds:0, visited:false};
    return {question: id, type: q.type, task_id: q.task_id, complete: complete(q,a), good: a.good, n_shown: q.outputs.length, comment: a.comment, seconds: a.seconds}; });
  const out = {annotator: S.annotator, packet: S.packet, built: DATA.built, started: S.started, finished: new Date().toISOString(), answers: rows};
  const left = rows.filter(r => !r.complete).length;
  const text = JSON.stringify(out, null, 1);
  app.innerHTML = `
  <div class="start result">
    <div><h1>标注结果</h1>
      <p>${left ? `还有 <b>${left}</b> 题没选完，可以先复制，也可以返回补完。` : '全部题目已完成。'}把下面的 JSON 整段复制，发回给 Sophie。</p></div>
    <div class="card">
      <div class="nav" style="margin:0 0 10px"><button class="primary" id="copy">复制到剪贴板</button><button id="back">返回题目</button><span class="hint" id="copied"></span></div>
      <textarea id="json" readonly>${esc(text)}</textarea>
    </div>
  </div>`;
  $('#json').onclick = e => e.target.select();
  $('#copy').onclick = async () => { const ta = $('#json'); ta.select();
    try{ await navigator.clipboard.writeText(text); $('#copied').textContent = '已复制'; }
    catch(e){ try{ document.execCommand('copy'); $('#copied').textContent = '已复制'; }catch(_){ $('#copied').textContent = '请手动全选复制'; } } };
  $('#back').onclick = () => renderQuestion();
}
renderStart();
</script>
