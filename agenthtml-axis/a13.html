<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentHTML 分轴标注</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--ink:#1b1f27;--ink-2:#4b5262;--ink-3:#7d8494;--ground:#f5f6f8;--paper:#fff;--line:#d9dde5;--accent:#2f5d8a;--accent-ink:#fff;--accent-soft:#e6eef7;--ok:#1f7a4d;--ok-soft:#e3f2ea;--warn:#a15c00;--warn-soft:#fbf0dc;--bad:#b42318;--bad-soft:#fdecea}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 "IBM Plex Sans",-apple-system,"PingFang SC",sans-serif}
.wrap{max-width:1640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 6px} h2{font-size:17px;margin:0 0 8px} p{margin:0 0 10px;max-width:78ch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px}
.hint{color:var(--ink-3);font-size:13px} .mono{font-family:"IBM Plex Mono",monospace}
button{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)} button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],textarea{font:inherit;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--paper);color:var(--ink)}
textarea{min-height:52px;resize:vertical}
.top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.taskcard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.taskcard .card{border-left:4px solid var(--accent)} .taskcard .out{border-left-color:var(--warn)}
.label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.steps{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.steps button{border-radius:999px} .steps button.done{border-color:var(--ok);color:var(--ok)}
.steps button.on.done{color:var(--accent-ink)}
.guide{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.guide ul{margin:6px 0 0 18px;padding:0} .guide li{margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rep{background:var(--paper);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.rep header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.rep header .l{font-family:"IBM Plex Mono",monospace;background:var(--ink);color:var(--paper);border-radius:4px;padding:0 8px;line-height:24px}
.rep header .sp{flex:1}
.rep iframe{width:100%;height:62vh;border:0;background:#fff}
.rep.big{grid-column:1/-1} .rep.big iframe{height:86vh}
.panel{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:13px;padding:4px 10px}
.chips button.on.badc{background:var(--bad);border-color:var(--bad)}
.chips button.on.okc{background:var(--ok);border-color:var(--ok)}
.qrow{display:grid;grid-template-columns:1fr;gap:4px;padding:6px 0;border-bottom:1px dashed var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .qt{font-size:13px;color:var(--ink-2)}
.timer{font-family:"IBM Plex Mono",monospace;font-size:14px;min-width:48px;text-align:right}
.timer.low{color:var(--bad)}
.pickrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.nav{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap} .nav .sp{flex:1}
.start{max-width:760px;margin:30px auto;display:flex;flex-direction:column;gap:14px}
.axis{display:grid;grid-template-columns:auto 1fr;gap:6px 12px} .axis b{white-space:nowrap}
@media (max-width:1100px){.grid{grid-template-columns:1fr}.taskcard{grid-template-columns:1fr}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const DATA = {"questions": [{"id": "AX-code_repair/01_benjamincorcoran__sasdocs-41-fable5.1", "type": 2, "task_id": "01_benjamincorcoran__sasdocs-41", "domain": "code_repair", "task_summary": "修复 SAS 解析器无法处理带斜杠显式选项的数据步和过程声明的问题。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/5e34f061daaf.html"}, {"label": "B", "file": "reports/f229c4256893.html"}, {"label": "C", "file": "reports/7b95d6c6f3fd.html"}], "outcome": "Agent 最终提交了一个仅含复现示例的补丁，没有修改解析器或新增有效测试，因此问题未修复。", "content": false, "scored_task": true}, {"id": "AX-travel_planning/02_task15_fortlauderdale_to_norfolk-deepseek-v4.1-flash", "type": 2, "task_id": "02_task15_fortlauderdale_to_norfolk", "domain": "travel_planning", "task_summary": "为两人规划2022年3月16日至18日从劳德代尔堡到诺福克的三日旅行，并将总支出控制在2300美元内。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/4e5657c9e625.html"}, {"label": "B", "file": "reports/fe9791b2b13d.html"}, {"label": "C", "file": "reports/2efc4a8f0efb.html"}], "outcome": "Agent完成了自驾往返、两晚住宿、六顿餐食和每日一项活动的方案，核算总价1415美元、余885美元，但搜索数据和行程可行性存在明显限制。", "content": true, "scored_task": false}, {"id": "AX-code_repair/05_airspeed-velocity__asv-702-gpt5.6", "type": 2, "task_id": "05_airspeed-velocity__asv-702", "domain": "code_repair", "task_summary": "修复 asv profile 无法在 existing 或 --python=same 环境中运行并生成分析结果的问题。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/15aa0e3157b0.html"}, {"label": "B", "file": "reports/c1c2f5652146.html"}, {"label": "C", "file": "reports/cc15656be81a.html"}], "outcome": "Agent 复现了故障并反复修改 profiling 命令逻辑，但原命令仍报相同错误，且未运行测试或提交成功，因此任务未完成。", "content": false, "scored_task": false}, {"id": "AX-terminal_devops/03_cancel-async-tasks-gpt6-astra-low", "type": 2, "task_id": "03_cancel-async-tasks", "domain": "terminal_devops", "task_summary": "实现一个限制异步任务并发数、且在键盘中断取消时仍能执行任务清理代码的 Python 函数。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/4096a91494b4.html"}, {"label": "B", "file": "reports/a7fb6e2a57d0.html"}, {"label": "C", "file": "reports/c2552d668cec.html"}], "outcome": "Agent 声称已创建可导入的 run_tasks 函数并完成测试，但轨迹隐藏了源码、测试命令和输出，无法独立确认并发限制及取消清理行为。", "content": false, "scored_task": false}, {"id": "AX-tool_use_customer_service/02_gpt-4o-retail_28-gpt5.6", "type": 2, "task_id": "02_gpt-4o-retail_28", "domain": "tool_use_customer_service", "task_summary": "帮助客户退回多个已送达订单中的商品、取消待处理订单，并计算退款总额。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/cf12e1346fc8.html"}, {"label": "B", "file": "reports/8ea9fdefe89d.html"}, {"label": "C", "file": "reports/108f6d0aab26.html"}], "outcome": "退货申请和整笔待处理订单取消均已执行，但代理误称只取消了其中一件商品，并将实际应合计为2537.77美元的退款算成1013.51美元。", "content": false, "scored_task": false}, {"id": "AX-travel_planning/03_task30_houston_to_fayetteville-gpt5.6", "type": 2, "task_id": "03_task30_houston_to_fayetteville", "domain": "travel_planning", "task_summary": "为休斯敦出发的四口之家规划2022年3月20日至22日的费耶特维尔三日游，并在1500美元预算下选择交通、住宿、餐饮和亲子景点。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/abe1068774e5.html"}, {"label": "B", "file": "reports/219b16b39337.html"}, {"label": "C", "file": "reports/a7977e7a28c3.html"}], "outcome": "Agent完成了三日行程和选项筛选，但确认现有航班与合格住宿的最低已知成本已超过1500美元，因此没有得到满足预算的有效方案。", "content": false, "scored_task": false}, {"id": "AX-web_navigation/04_test_domain_test_domain_2_9-fable5.1", "type": 2, "task_id": "04_test_domain_test_domain_2_9", "domain": "web_navigation", "task_summary": "在 Petfinder 上查找雄性、黑色的拉布拉多寻回犬。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/240bb4e6b52a.html"}, {"label": "B", "file": "reports/f8d32a0ef7d5.html"}, {"label": "C", "file": "reports/4180212029ca.html"}], "outcome": "操作成功设置了拉布拉多寻回犬、雄性和黑色三项筛选条件，但轨迹没有展示最终结果列表、数量或具体宠物。", "content": false, "scored_task": false}, {"id": "AX-paper_reproduction/04_sequential-neural-score-estimation-gpt5.5", "type": 2, "task_id": "04_sequential-neural-score-estimation", "domain": "paper_reproduction", "task_summary": "依据论文及补充说明，在指定输出目录中编写完整、可运行的 NPSE/TSNPSE 论文复现代码和文档，并避用黑名单资源。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/0b1590c82e97.html"}, {"label": "B", "file": "reports/ed2d00bde21f.html"}, {"label": "C", "file": "reports/a6b5700a2800.html"}], "outcome": "任务未成功完成：agent 完成了论文与约束分析并创建了输出子目录，但因写入权限连续被拒绝，没有保存实现代码、运行实验或得到复现结果。", "content": false, "scored_task": false}, {"id": "AX-code_repair/03_Melevir__cognitive_complexity-15-gpt5.5", "type": 2, "task_id": "03_Melevir__cognitive_complexity-15", "domain": "code_repair", "task_summary": "修复认知复杂度计算中布尔逻辑运算符序列被错误叠加嵌套增量的问题，并更新相关测试。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/813e4182c171.html"}, {"label": "B", "file": "reports/78444bb535d7.html"}, {"label": "C", "file": "reports/4db81f120255.html"}], "outcome": "Agent 将 BoolOp 的复杂度改为只按布尔运算序列数计分，更新两个受影响的断言，最终 20 项测试全部通过并成功提交。", "content": true, "scored_task": false}, {"id": "AX-paper_reproduction/02_robust-clip-gemini3.8-flash", "type": 2, "task_id": "02_robust-clip", "domain": "paper_reproduction", "task_summary": "实现并记录一套完整、可运行的 Robust CLIP／FARE 论文复现代码，遵守补充说明与资源黑名单。", "fixed": "模型相同", "pick": 2, "outputs": [{"label": "A", "file": "reports/f20fa7d41114.html"}, {"label": "B", "file": "reports/8788d1381312.html"}, {"label": "C", "file": "reports/dace687c3baa.html"}], "outcome": "Agent 成功生成了涵盖训练、攻击和评估的复现软件包，并通过编译及核心冒烟检查，但未安装 pytest，也未执行需要数据、模型权重和多张高显存 GPU 的论文规模实验。", "content": false, "scored_task": false}], "packet": "a13", "built": "2026-09-24"};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VISUAL = ['表格溢出或被截断','图片 / 图表空白、没加载或被截断','文字重叠、被遮挡或截断','字太小、颜色太淡看不清','排版错乱（错位、大块空白、元素挤在一起）','交互控件点了没反应'];
const QUESTIONS = ['这份报告讲的是什么任务？最后成功了吗？','如果失败：卡在哪一步、为什么？如果成功：关键结果是什么？','报告里有没有证据让你相信这个结论（截图、数据、步骤记录等）？'];
const FIND = [['fast','30 秒内找到'],['slow','找到了，但超过 30 秒'],['no','没找到']];
const CLEAR = ['专有名词、术语','图和表（包括标题、坐标轴、图例）','文字表述'];   // hm, 2026-09-24: say what "understandable" means
let S = null, timers = {}, tStart = {};   // tStart survives re-renders so a running countdown keeps going
const SKEY = n => 'agenthtml-axis-proto2:' + (DATA.packet ? DATA.packet + ':' : '') + n;
const store = () => { try{ localStorage.setItem(SKEY(S.annotator), JSON.stringify(S)); }catch(e){} };
const load = n => { try{ const v = localStorage.getItem(SKEY(n)); return v ? JSON.parse(v) : null; }catch(e){ return null; } };
const blank = q => ({step:0, visual:{}, find:{}, easiest:null, unclear:{}, missing:'', note:''});

function start(){
  $('#app').innerHTML = `<div class="start">
   <div><h1>AgentHTML 分轴标注${DATA.packet ? '　·　题包 ' + DATA.packet : '（原型）'}</h1>
   <p>每一题是一个 agent 任务，以及同一个模型用三种方法写的三份 HTML 报告（A、B、C，匿名）。和之前「觉得好就勾」不同，这里按三件事分开看，每件事都有明确的检查目标：</p></div>
   <div class="card axis">
     <b>① 视觉</b><span>把每份报告从上往下滑一遍，只看显示有没有问题：表格、图片、文字有没有溢出、空白、重叠、看不清。不评价好不好看。</span>
     <b>② 信息获取</b><span>带着三个固定问题去找答案，每份报告限时 30 秒左右，记录能不能找到；最后选出最容易找到答案的一份。</span>
     <b>③ 内容</b><span>只在部分题出现：分三项看能不能看懂——专有名词和术语、图和表（含标题）、文字表述；再写下你想知道但报告没写的。事实对错由我们另外核对，不用你查。</span>
   </div>
   <div class="card"><label class="hint" for="who">标注者编号</label><input type="text" id="who" placeholder="例如 hm"><div style="height:10px"></div><button class="primary" id="go">开始（共 ${DATA.questions.length} 题）</button></div></div>`;
  $('#go').onclick = () => { const n = $('#who').value.trim(); if(!n) return $('#who').focus();
    S = load(n) || {annotator:n, i:0, answers:{}, started:new Date().toISOString()}; store(); render(); };
}
function A(){ const q = DATA.questions[S.i]; return S.answers[q.id] || (S.answers[q.id] = blank(q)); }
function stepsOf(q){ return q.content ? ['① 视觉','② 信息获取','③ 内容'] : ['① 视觉','② 信息获取']; }
function stepDone(q, a, k){
  const L = q.outputs.map(o => o.label);
  if(k===0) return L.every(l => a.visual[l] && a.visual[l].length);
  if(k===1) return L.every(l => QUESTIONS.every((_,j) => a.find[l] && a.find[l][j])) && !!a.easiest;
  return L.every(l => CLEAR.every((_,j) => a.unclear[l] && a.unclear[l][j]));
}
function render(){
  Object.values(timers).forEach(clearInterval); timers = {};
  const q = DATA.questions[S.i], a = A(), steps = stepsOf(q), k = Math.min(a.step, steps.length-1);
  $('#app').innerHTML = `
  <div class="top"><span class="mono">${esc(S.annotator)}${DATA.packet ? ' · ' + DATA.packet : ''}</span><span>第 <b>${S.i+1}</b> / ${DATA.questions.length} 题</span><span class="hint">同一任务、同一模型，三种生成方法</span></div>
  <div class="taskcard"><div class="card"><div class="label">任务</div>${esc(q.task_summary)}</div>
    <div class="card out"><div class="label">实际结果（来自 agent 执行记录）</div>${esc(q.outcome)}</div></div>
  <div class="steps">${steps.map((s,j)=>`<button class="${j===k?'on':''} ${stepDone(q,a,j)?'done':''}" data-s="${j}">${s}${stepDone(q,a,j)?' ✓':''}</button>`).join('')}</div>
  ${guide(k)}
  <div class="grid">${q.outputs.map(o => `<div class="rep" data-l="${o.label}"><header><span class="l">${o.label}</span><span class="sp"></span><button class="zoom">放大</button></header>
     <iframe src="${esc(o.file)}" title="报告 ${o.label}" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
     <div class="panel">${panel(k, q, a, o.label)}</div></div>`).join('')}</div>
  ${k===1 ? `<div class="pickrow card"><b>三份里，哪一份最容易找到这些答案？</b>${q.outputs.map(o=>`<button class="pick ${a.easiest===o.label?'on':''}" data-l="${o.label}">${o.label}</button>`).join('')}<button class="pick ${a.easiest==='same'?'on':''}" data-l="same">差不多</button></div>` : ''}
  ${k===2 ? `<div class="card" style="margin-top:12px"><b>有没有你想知道、但三份报告都没写的？</b><textarea id="missing" placeholder="可以不填">${esc(a.missing)}</textarea></div>` : ''}
  <div class="nav"><button id="prev" ${S.i===0&&k===0?'disabled':''}>上一步</button><button class="primary" id="next">${k<steps.length-1?'下一步':(S.i<DATA.questions.length-1?'下一题':'完成，生成结果')}</button><span class="sp"></span><button id="export">随时生成结果</button></div>`;
  bind(q, a, k, steps);
}
function guide(k){
  if(k===0) return `<div class="guide"><b>① 视觉：</b>把每份报告从上到下完整滑一遍（可以点「放大」），在下面勾出看到的显示问题；没有问题就点「没发现问题」。只看有没有显示错误，不看好不好看。<ul>${VISUAL.map(v=>`<li>${v}</li>`).join('')}</ul></div>`;
  if(k===1) return `<div class="guide"><b>② 信息获取：</b>对每份报告点「开始计时」，然后去找下面三个问题的答案，30 秒左右为限，不用读完全文。每个问题选「30 秒内找到 / 找到但超过 30 秒 / 没找到」。三份都做完后，选出最容易找到答案的一份。<ul>${QUESTIONS.map((t,j)=>`<li>Q${j+1}　${t}</li>`).join('')}</ul></div>`;
  return `<div class="guide"><b>③ 内容：</b>这一步只在部分题出现。不需要核对事实对错（我们会另外核对），只看一个没参与这个任务的人能不能看懂，分三项判断：<ul>
    <li><b>专有名词、术语</b>：出现的专业词、缩写、代号（比如 reward、done、trajectory、字段名）有没有解释，或者看上下文能不能懂</li>
    <li><b>图和表</b>：图表和表格的标题、坐标轴、图例、列名说清楚了没有，看得出它想说明什么吗</li>
    <li><b>文字表述</b>：句子本身读得懂吗，有没有大段原始日志、代码没配说明，或者前后矛盾</li></ul>看不懂的地方可以在备注里写一下是哪里。</div>`;
}
function panel(k, q, a, l){
  if(k===0){ const v = a.visual[l] || [];
    return `<div class="hint">看到的显示问题（可多选）</div><div class="chips">${VISUAL.map((t,j)=>`<button class="vis badc ${v.includes(j)?'on':''}" data-l="${l}" data-j="${j}">${t.split('（')[0]}</button>`).join('')}<button class="vis okc ${v.includes('none')?'on':''}" data-l="${l}" data-j="none">没发现问题</button></div>`; }
  if(k===1){ const f = a.find[l] || {};
    return `<div style="display:flex;align-items:center;gap:8px"><button class="tick" data-l="${l}">开始计时</button><span class="timer" id="t-${l}">0:30</span></div>` +
      QUESTIONS.map((t,j)=>`<div class="qrow"><span class="qt">Q${j+1}</span><div class="chips">${FIND.map(([v,lab])=>`<button class="fnd ${f[j]===v?'on':''} ${v==='no'?'badc':(v==='fast'?'okc':'')}" data-l="${l}" data-j="${j}" data-v="${v}">${lab}</button>`).join('')}</div></div>`).join(''); }
  const u = a.unclear[l] || {};
  return CLEAR.map((t,j)=>`<div class="qrow"><span class="qt">${t}</span><div class="chips"><button class="unc okc ${u[j]==='ok'?'on':''}" data-l="${l}" data-j="${j}" data-v="ok">看得懂</button><button class="unc ${u[j]==='part'?'on':''}" data-l="${l}" data-j="${j}" data-v="part">部分看不懂</button><button class="unc badc ${u[j]==='no'?'on':''}" data-l="${l}" data-j="${j}" data-v="no">看不懂</button><button class="unc ${u[j]==='na'?'on':''}" data-l="${l}" data-j="${j}" data-v="na">报告里没有</button></div></div>`).join('') +
    `<textarea class="uncnote" data-l="${l}" placeholder="看不懂的是哪里（可选）">${esc(u.note)}</textarea>`;
}
function bind(q, a, k, steps){
  document.querySelectorAll('.steps button').forEach(b => b.onclick = () => { a.step = +b.dataset.s; store(); render(); });
  document.querySelectorAll('.zoom').forEach(b => b.onclick = () => { const r = b.closest('.rep'); const on = r.classList.toggle('big'); b.textContent = on ? '还原' : '放大'; if(on) r.scrollIntoView({behavior:'smooth'}); });
  document.querySelectorAll('.vis').forEach(b => b.onclick = () => { const l=b.dataset.l, j=b.dataset.j==='none'?'none':+b.dataset.j; let v=a.visual[l]||[];
    v = j==='none' ? (v.includes('none')?[]:['none']) : (v.includes(j)?v.filter(x=>x!==j):[...v.filter(x=>x!=='none'), j]); a.visual[l]=v; store(); render(); });
  document.querySelectorAll('.fnd').forEach(b => b.onclick = () => { const l=b.dataset.l; (a.find[l] ||= {})[+b.dataset.j] = b.dataset.v; store(); render(); });
  document.querySelectorAll('.pick').forEach(b => b.onclick = () => { a.easiest = b.dataset.l; store(); render(); });
  const runTimer = l => { const id = q.id+'|'+l, el = $('#t-'+l); clearInterval(timers[l]);
    const tick = () => { const s = 30 - Math.floor((Date.now() - tStart[id]) / 1000); el.textContent = s>=0 ? `0:${String(s).padStart(2,'0')}` : `+${-s}s`; el.classList.toggle('low', s<=5); };
    tick(); timers[l] = setInterval(tick, 250); };
  document.querySelectorAll('.tick').forEach(b => b.onclick = () => { tStart[q.id+'|'+b.dataset.l] = Date.now(); runTimer(b.dataset.l); });
  if(k===1) q.outputs.forEach(o => { if(tStart[q.id+'|'+o.label]) runTimer(o.label); });
  document.querySelectorAll('.unc').forEach(b => b.onclick = () => { const l=b.dataset.l; a.unclear[l] = {...(a.unclear[l]||{}), [b.dataset.j]:b.dataset.v}; store(); render(); });
  document.querySelectorAll('.uncnote').forEach(t => t.oninput = () => { const l=t.dataset.l; a.unclear[l] = {...(a.unclear[l]||{}), note:t.value}; store(); });
  const m = $('#missing'); if(m) m.oninput = () => { a.missing = m.value; store(); };
  $('#prev').onclick = () => { if(k>0){ a.step=k-1; } else { S.i--; const p=A(); p.step=stepsOf(DATA.questions[S.i]).length-1; } store(); render(); };
  $('#next').onclick = () => { if(k<steps.length-1){ a.step=k+1; } else if(S.i<DATA.questions.length-1){ S.i++; A().step=0; } else return result(); store(); render(); window.scrollTo(0,0); };
  $('#export').onclick = result;
}
function result(){
  const out = {annotator:S.annotator, packet:DATA.packet || 'prototype', built:DATA.built, started:S.started, finished:new Date().toISOString(),
    answers: DATA.questions.map(q => ({question:q.id, ...(S.answers[q.id]||blank(q)), step:undefined}))};
  const text = JSON.stringify(out, null, 1);
  $('#app').innerHTML = `<div class="start"><h1>标注结果</h1><p>把下面整段复制，发回给 Sophie。</p><div class="card"><button class="primary" id="cp">复制</button> <button id="back">返回</button><div style="height:8px"></div><textarea style="min-height:320px" class="mono" readonly>${esc(text)}</textarea></div></div>`;
  $('#cp').onclick = async () => { try{ await navigator.clipboard.writeText(text); $('#cp').textContent='已复制'; }catch(e){ $('#cp').textContent='请手动复制'; } };
  $('#back').onclick = render;
}
start();
</script></body></html>
