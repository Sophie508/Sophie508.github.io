<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 轨迹进度标注 · CPC Annotation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fafaf7;color:#1a1a1a;font-size:14.5px;line-height:1.7}
.wrap{max-width:1150px;margin:0 auto;padding:24px}
h1{font-size:24px;margin-bottom:4px} h2{font-size:19px;margin:14px 0 8px} h3{font-size:15.5px;margin:10px 0 6px}
.sub{color:#666;margin-bottom:14px;font-size:13px}
.card{background:#fff;border:1px solid #d8d4c8;padding:18px 22px;margin:12px 0;border-radius:4px}
.btn{background:#1a1a1a;color:#fff;border:none;padding:9px 20px;font-size:14px;cursor:pointer;border-radius:3px;margin:4px 6px 4px 0}
.btn:disabled{background:#bbb;cursor:not-allowed}
.btn.sec{background:#fff;color:#1a1a1a;border:1.5px solid #1a1a1a}
.prog{position:sticky;top:0;background:#fff;border-bottom:1px solid #d8d4c8;padding:8px 24px;z-index:10;font-size:12.5px;color:#444;display:flex;gap:14px;align-items:center}
.prog b{color:#c14a1d}
select,input[type=text],input[type=number],textarea{border:1px solid #bbb;padding:6px 9px;font-size:14px;border-radius:3px;font-family:inherit}
textarea{width:100%} label{display:block;margin:8px 0 3px;font-weight:600;font-size:13.5px}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.tab{padding:6px 13px;border:1.5px solid #999;border-radius:3px;cursor:pointer;font-size:13px;background:#fff}
.tab.act{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.tab.done{border-color:#5a8c3a;color:#5a8c3a} .tab.act.done{background:#5a8c3a;color:#fff}
.log{background:#141412;color:#d9d7cf;font-family:"SF Mono","JetBrains Mono",Consolas,monospace;font-size:11.8px;line-height:1.55;padding:14px;height:430px;overflow:auto;white-space:pre-wrap;word-break:break-all;border-radius:4px}
.slog{background:#fbfaf7;border:1px solid #d8d4c8;height:460px;overflow:auto;padding:10px 14px;border-radius:4px}
.ev{margin:8px 0;border-radius:4px}
.ev pre{white-space:pre-wrap;word-break:break-word;font-family:"SF Mono","JetBrains Mono",Consolas,monospace;font-size:11.5px;line-height:1.5;margin:4px 0 0;color:#222}
.ev-msg{background:#fff;border:1px solid #cfd8e3;border-left:3px solid #4a6fa5;padding:8px 11px}
.ev-tool{background:#f4f2ee;border:1px solid #ddd8cd;padding:7px 11px}
.ev-tag{font-weight:600;font-size:12.5px;color:#333}
.ev-st{font-weight:400;font-size:11px;margin-left:6px}
.ok2{color:#5a8c3a}.warn2{color:#c14a1d}
.ev-th{background:#faf7ef;border:1px dashed #cbbfa5;padding:6px 11px;color:#7a6f57}
.ev-user{background:#f3efe5;border:1px solid #d8d4c8;padding:6px 11px}
.ev-oth,.ev-raw{background:#f6f6f6;border:1px solid #e0e0e0;padding:6px 11px}
.ev summary,.ev-out summary{cursor:pointer;font-size:12px;color:#555;user-select:none}
.ev-out{margin-top:5px}
.logbar{margin:6px 0 4px}
.lbtn{padding:4px 10px!important;font-size:11.5px!important}
.inst{background:#f3efe5;border-left:3px solid #002fa7;padding:10px 14px;margin:8px 0;max-height:230px;overflow:auto;white-space:pre-wrap;font-size:13px}
.qrow{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.score{width:70px} .radio label{display:inline;font-weight:400;margin-right:12px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
th{background:#eee;text-align:left;padding:6px 8px;font-size:11.5px} td{border-bottom:1px solid #e5e1d5;padding:6px 8px;vertical-align:top}
.warn{background:#fff3a8;padding:8px 12px;border-radius:3px;margin:8px 0;font-size:13px}
.ok{color:#5a8c3a;font-weight:700} .miss{color:#c14a1d;font-weight:700}
.ranking input{width:52px}
.hide{display:none}
footer{color:#888;font-size:12px;padding:20px 0;text-align:center}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div class="wrap" id="app">加载中… / Loading…</div>
<footer>本页面纯本地运行,不上传任何数据。完成后请下载压缩包发给研究者。<br>All processing is local; nothing is uploaded. Download the archive and send it to the researcher when done.</footer>
<script>
"use strict";
/* ---------- 状态 ---------- */
const S = {step:"consent", labeler:null, demo:{}, cal:{}, ans:{}, order:[], ti:0, tab:0};
const LS_KEY = "cpc_annotation_v1";
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
function load(){ try{ const x=JSON.parse(localStorage.getItem(LS_KEY)); if(x&&x.labeler!==undefined) Object.assign(S,x);}catch(e){} }
let MAN=null; const TASKCACHE={}; let CAL=null;
async function getJSON(u){ const r=await fetch(u); if(!r.ok) throw new Error(u); return r.json(); }
async function taskDoc(t){ if(!TASKCACHE[t]) TASKCACHE[t]=await getJSON("data/tasks/"+t+".json"); return TASKCACHE[t]; }
/* 种子乱序(mulberry32) */
function shuffled(arr,seed){ const a=arr.slice(); let s=seed>>>0;
  const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
/* ---------- 渲染 ---------- */
const app=document.getElementById("app"), prog=document.getElementById("prog");
function el(h){ const d=document.createElement("div"); d.innerHTML=h; return d; }
function render(){ save(); prog.innerHTML=progHTML();
  ({consent:rConsent,demo:rDemo,guide:rGuide,cal:rCal,task:rTask,exp:rExport})[S.step](); window.scrollTo(0,0); }
function progHTML(){
  const done=S.order.filter(t=>taskComplete(t)).length;
  return `标注者 <b>${S.labeler||"未选择"}</b> · 阶段:${{consent:"①同意与信息",demo:"①问卷",guide:"②标注指南",cal:"③校准练习",task:"④正式标注",exp:"⑤导出"}[S.step]}`+
   (S.step==="task"?` · 任务 <b>${S.ti+1}/${S.order.length}</b>(已完成 ${done})`:"")+
   ` <button class="btn sec" style="padding:3px 10px;font-size:11px" onclick="jump()">跳到未完成</button>`;
}
async function jump(){ if(!S.order.length) return; for(const t of S.order) await taskDoc(t);
 const i=S.order.findIndex(t=>!taskComplete(t)); if(i>=0){S.step="task";S.ti=i;S.tab=0;render();} else {S.step="exp";render();} }
/* ---------- ① 同意 + ID ---------- */
function rConsent(){ app.innerHTML=`
<h1>Agent 轨迹进度标注</h1><div class="sub">预计总耗时约 12–14 小时,可随时关闭浏览器,进度自动保存在本机。</div>
<div class="card"><h2>知情同意</h2>
<p>本研究评估自动化打分方法与人类判断的一致性。你将阅读 AI agent 解题的执行日志并做出判断。
全程<b>纯本地</b>处理,不收集姓名、邮箱等身份信息;参与自愿,可随时退出且无任何不利。
你的判断没有"标准答案",请独立作答,<b>不要与其他标注者讨论</b>。</p></div>
<div class="card"><h2>选择你的标注者编号</h2>
<p>请使用研究者分配给你的编号(不要填真实姓名):</p>
<select id="lab"><option value="">— 选择 —</option><option>A1</option><option>A2</option><option>A3</option><option>A4</option></select>
<button class="btn" onclick="pickLab()">同意并继续</button>
${localStorage.getItem(LS_KEY)&&S.labeler?`<button class="btn sec" onclick="S.step=lastStep();render()">继续上次进度(${S.labeler})</button>`:""}
</div>`;
  if(S.labeler) document.getElementById("lab").value=S.labeler; }
function lastStep(){ return S.order.length? "task":"demo"; }
function pickLab(){ const v=document.getElementById("lab").value; if(!v){alert("请选择编号");return;}
  if(S.labeler && S.labeler!==v && Object.keys(S.ans).length){ if(!confirm("更换编号将清空已有进度,确定?")) return; Object.assign(S,{demo:{},cal:{},ans:{},order:[],ti:0}); }
  S.labeler=v; S.step="demo"; render(); }
/* ---------- ① 人口学 ---------- */
const DEMOQ=[["age","年龄段",["18-22","23-27","28-34","35+"]],
 ["role","当前身份",["本科生","硕士生","博士生","业界工程师","其他"]],
 ["cs_bg","计算机/数据背景",["有(专业相关)","部分(用过编程)","无"]],
 ["llm_use","LLM 使用频率",["每天","每周","偶尔","几乎不用"]],
 ["agent_exp","是否用过 AI agent(如 Claude Code / Codex / Copilot 等)",["经常","用过几次","没用过"]],
 ["en_read","英文技术文本阅读",["流畅","可读但较慢","困难"]]];
function rDemo(){ app.innerHTML=`<h1>背景问卷</h1><div class="sub">仅用于描述标注者群体,不关联身份。</div>
<div class="card">${DEMOQ.map(([k,q,ops])=>`<label>${q}</label><select id="d_${k}">
<option value="">—</option>${ops.map(o=>`<option ${S.demo[k]===o?"selected":""}>${o}</option>`).join("")}</select>`).join("")}
<br><button class="btn" onclick="saveDemo()">提交,看标注指南</button></div>`; }
function saveDemo(){ for(const [k] of DEMOQ){ const v=document.getElementById("d_"+k).value; if(!v){alert("请完成全部问卷");return;} S.demo[k]=v; }
  S.step="guide"; render(); }
/* ---------- ② 指南 ---------- */
function rGuide(){ app.innerHTML=`<h1>标注指南(务必读完)</h1>
<div class="card"><h3>你要做什么</h3>
<p>每个"任务块"包含同一道题的多条 agent 执行日志。<b>先把该任务的所有日志读一遍</b>(可做笔记),然后回答:</p>
<p><b>Q1 进度分(0–10)</b>:这条轨迹把任务完成到几成?0=毫无进展,10=完全正确完成。<br>
<b>Q1b 成没成(是/否)</b>:总体而言,你认为它算完成了任务吗?<br>
<b>Q2 组内排序</b>:给本任务的所有轨迹排名(1=最好;允许并列,如两个第 2 名)。<br>
<b>Q3 逐条核对</b>(仅部分轨迹出现):对照给出的检查清单,逐条判断该轨迹是否满足,并写一句证据出处。</p></div>
<div class="card"><h3>三条铁律</h3>
<p>1. <b>agent 自己说做完了不算数</b>——只有日志里<b>展示出来</b>的命令输出、文件内容才是证据;<br>
2. Q3 判不了就选"<b>判不了</b>"(证据不足),不要硬猜;<br>
3. 判断的是<b>进度与正确性</b>,不是文风、不是啰嗦程度、也不用猜是哪家的 agent(日志风格可能露出厂商,忽略它)。</p></div>
<div class="card"><h3>怎么读日志</h3><p>执行日志已按事件<b>结构化显示</b>:🤖 是 agent 的发言,⚙️ 是工具调用(其下"命令输出"是<b>证据的主要来源</b>,较长的默认折叠、点开查看),💭 是 agent 内部思考(默认折叠,通常无需细读)。可用"展开全部/收起全部"批量操作;不放心渲染时点"查看原始日志"看原文。</p></div>
<div class="card"><h3>其他</h3><p>进度自动保存,可分多天完成;先做 2 条<b>校准练习</b>(不计入正式数据)熟悉界面与口径。遇到界面问题联系研究者,但<b>不要讨论具体轨迹的判断</b>。</p>
<button class="btn" onclick="startCal()">开始校准练习</button></div>`; }
async function startCal(){ CAL=CAL||await getJSON("data/calibration.json"); S.step="cal"; render(); }
/* ---------- ③ 校准 ---------- */
function rCal(){ const i=S.cal.i||0; const c=CAL[i];
 app.innerHTML=`<h1>校准练习 ${i+1}/${CAL.length}</h1><div class="sub">练习不计入正式数据;目的:熟悉界面、统一口径。</div>
<div class="card"><h3>任务说明</h3><div class="inst">${esc(c.instruction)}</div>
<h3>执行日志</h3>${logView(c.log,"cal")}
<div class="qrow"><label>Q1 进度分(0-10):</label><input class="score" type="number" min="0" max="10" step="0.5" id="c_q1" value="${(S.cal["q1_"+i]??"")}"></div>
<div class="qrow radio"><label>Q1b 算完成吗:</label><label><input type="radio" name="c_q1b" value="yes" ${S.cal["q1b_"+i]==="yes"?"checked":""}>是</label><label><input type="radio" name="c_q1b" value="no" ${S.cal["q1b_"+i]==="no"?"checked":""}>否</label></div>
<h3>Q3 试判 3 条</h3><table><thead><tr><th>要求</th><th>怎么核验</th><th>判定</th></tr></thead><tbody>
${c.items.slice(0,3).map((it,k)=>`<tr><td>${esc(it.requirement)}</td><td>${esc(it.verification)}</td>
<td class="radio">${["满足","不满足","判不了"].map(v=>`<label><input type="radio" name="c_it${k}" value="${v}" ${S.cal[`it_${i}_${k}`]===v?"checked":""}>${v}</label>`).join("")}</td></tr>`).join("")}
</tbody></table>
<button class="btn" onclick="calNext(${i})">${i+1<CAL.length?"下一条练习":"完成校准,开始正式标注"}</button></div>`; }
function calNext(i){ S.cal["q1_"+i]=document.getElementById("c_q1").value;
 S.cal["q1b_"+i]=(document.querySelector("input[name=c_q1b]:checked")||{}).value;
 [0,1,2].forEach(k=>{S.cal[`it_${i}_${k}`]=(document.querySelector(`input[name=c_it${k}]:checked`)||{}).value;});
 if(i+1<CAL.length){S.cal.i=i+1; render();} else { beginTasks(); } }
async function beginTasks(){ if(!S.order.length){ const cfg=MAN.labelers[S.labeler];
  S.order=shuffled(MAN.tasks.map(t=>t.task), cfg.task_order_seed); }
 for(const t of S.order) await taskDoc(t);
 S.step="task"; S.ti=S.order.findIndex(t=>!taskComplete(t)); if(S.ti<0)S.ti=0; S.tab=0; render(); }
/* ---------- ④ 任务块 ---------- */
function A(tid){ return S.ans[tid]=S.ans[tid]||{}; }
function taskComplete(task){ const d=TASKCACHE[task]; if(!d) return !!S.ansDone&&S.ansDone[task];
 return d.trajectories.every(tr=>{const a=S.ans[tr.id]||{}; if(a.q1===undefined||a.q1===""||!a.q1b||!a.rank) return false;
  if(isCore(task,tr.id)) return d.items.every((_,k)=>a["i"+k]); return true; }); }
function isCore(task,tid){ return MAN.labelers[S.labeler].q3_ids.includes(tid); }
async function rTask(){ const task=S.order[S.ti]; const d=await taskDoc(task);
 const tr=d.trajectories[S.tab]; const a=A(tr.id); const core=isCore(task,tr.id);
 app.innerHTML=`<h1>任务 ${S.ti+1}/${S.order.length}:${task}</h1>
<div class="card"><h3>任务说明(所有轨迹同题)</h3><div class="inst">${esc(d.instruction)}</div></div>
<div class="tabs">${d.trajectories.map((t,j)=>{const aa=S.ans[t.id]||{};const dn=aa.q1!==undefined&&aa.q1!==""&&aa.q1b&&aa.rank&&(!isCore(task,t.id)||d.items.every((_,k)=>aa["i"+k]));
  return `<div class="tab ${j===S.tab?"act":""} ${dn?"done":""}" onclick="S.tab=${j};saveCur();render()">轨迹 ${j+1}${isCore(task,t.id)?" ★":""}${dn?" ✓":""}</div>`}).join("")}</div>
<div class="card">
<h3>轨迹 ${S.tab+1} 执行日志 ${core?'<span class="warn" style="padding:2px 8px">★ 本条需逐条核对(Q3)</span>':""}</h3>
${logView(tr.log,"t"+S.ti+"_"+S.tab)}
<div class="qrow"><label>Q1 进度分(0-10):</label><input class="score" type="number" min="0" max="10" step="0.5" id="q1" value="${a.q1??""}">
<label style="margin-left:18px">Q1b 算完成吗:</label><span class="radio"><label><input type="radio" name="q1b" value="yes" ${a.q1b==="yes"?"checked":""}>是</label><label><input type="radio" name="q1b" value="no" ${a.q1b==="no"?"checked":""}>否</label></span>
<label style="margin-left:18px">Q2 本组排名(1=最好,可并列):</label><span class="ranking"><input type="number" min="1" max="${d.trajectories.length}" id="rank" value="${a.rank??""}"></span></div>
${core?`<h3>Q3 逐条核对(★)</h3><table><thead><tr><th style="width:34%">要求</th><th style="width:30%">怎么核验</th><th>判定</th><th style="width:22%">证据出处(一句话)</th></tr></thead><tbody>
${d.items.map((it,k)=>`<tr><td>${esc(it.requirement)}</td><td>${esc(it.verification)}</td>
<td class="radio">${["满足","不满足","判不了"].map(v=>`<label><input type="radio" name="it${k}" value="${v}" ${a["i"+k]===v?"checked":""}>${v}</label>`).join("<br>")}</td>
<td><textarea rows="2" id="ev${k}">${esc(a["e"+k]||"")}</textarea></td></tr>`).join("")}
</tbody></table>`:""}
<div style="margin-top:10px">
<button class="btn sec" onclick="nav(-1)">← 上一条/上一任务</button>
<button class="btn" onclick="nav(1)">保存,下一条 →</button>
<span id="miss" class="miss"></span></div></div>`; }
function saveCur(){ const task=S.order[S.ti]; const d=TASKCACHE[task]; if(!d) return;
 const tr=d.trajectories[S.tab]; const a=A(tr.id);
 const q1=document.getElementById("q1"); if(!q1) return;
 a.q1=q1.value; a.q1b=(document.querySelector("input[name=q1b]:checked")||{}).value;
 a.rank=document.getElementById("rank").value;
 if(isCore(task,tr.id)) d.items.forEach((_,k)=>{ a["i"+k]=(document.querySelector(`input[name=it${k}]:checked`)||{}).value;
   const ev=document.getElementById("ev"+k); if(ev) a["e"+k]=ev.value; });
 save(); }
async function nav(dir){ saveCur(); const task=S.order[S.ti]; const d=await taskDoc(task);
 if(dir>0){ const tr=d.trajectories[S.tab]; const a=S.ans[tr.id]||{};
   const missing=[]; if(a.q1===undefined||a.q1==="")missing.push("Q1"); if(!a.q1b)missing.push("Q1b"); if(!a.rank)missing.push("Q2排名");
   if(isCore(task,tr.id)) d.items.forEach((it,k)=>{ if(!a["i"+k]) missing.push("Q3第"+(k+1)+"条"); });
   if(missing.length){ document.getElementById("miss").textContent="未完成:"+missing.join("、"); return; } }
 let t2=S.tab+dir, ti2=S.ti;
 if(t2>=d.trajectories.length){ ti2++; t2=0; } if(t2<0){ ti2--; t2=0; }
 if(ti2>=S.order.length){ S.step="exp"; render(); return; }
 if(ti2<0){ ti2=0; t2=0; }
 S.ti=ti2; S.tab=t2; render(); }
/* ---------- ⑤ 导出 ---------- */
async function rExport(){ const undone=[];
 for(const t of S.order){ await taskDoc(t); if(!taskComplete(t)) undone.push(t); }
 app.innerHTML=`<h1>导出结果</h1>
${undone.length?`<div class="warn">⚠️ 还有 ${undone.length} 个任务未完成:${undone.join("、")}。可返回补完,也可先导出中间存档。</div>
<button class="btn sec" onclick="jump()">返回补完</button>`:`<div class="card"><span class="ok">✅ 全部完成!</span> 感谢参与。</div>`}
<div class="card"><p>点击下载压缩包(JSON + CSV),然后把文件发给研究者。文件名含你的编号与时间。</p>
<button class="btn" onclick="doExport()">下载压缩包</button></div>`; }
function toCSV(){ const rows=[["labeler","trajectory_id","q1_score","q1b_complete","q2_rank","q3_item_index","q3_judgment","q3_evidence"]];
 for(const t of S.order){ const d=TASKCACHE[t]; if(!d) continue;
  for(const tr of d.trajectories){ const a=S.ans[tr.id]||{};
   const coreN=isCore(t,tr.id)? d.items.length:0;
   if(coreN){ d.items.forEach((_,k)=>rows.push([S.labeler,tr.id,a.q1??"",a.q1b??"",a.rank??"",k+1,a["i"+k]??"",(a["e"+k]||"").replace(/[\r\n,]+/g," ")])); }
   else rows.push([S.labeler,tr.id,a.q1??"",a.q1b??"",a.rank??"","","",""]); } }
 return rows.map(r=>r.join(",")).join("\n"); }
/* 最小 STORE zip */
function crc32(u8){let c,t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}
 let cr=0^-1;for(let i=0;i<u8.length;i++)cr=(cr>>>8)^t[(cr^u8[i])&0xFF];return (cr^-1)>>>0;}
function makeZip(files){ const enc=new TextEncoder(); const parts=[]; const cd=[]; let off=0;
 for(const [name,text] of files){ const nm=enc.encode(name), data=enc.encode(text), crc=crc32(data);
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(8,0,true);
  lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(lh.buffer),nm,data);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true); ch.setUint16(6,20,true); ch.setUint32(16,crc,true);
  ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
  cd.push(new Uint8Array(ch.buffer),nm);
  off+=30+nm.length+data.length; }
 const cdStart=off; let cdLen=0; cd.forEach(x=>cdLen+=x.length);
 const eo=new DataView(new ArrayBuffer(22));
 eo.setUint32(0,0x06054b50,true); eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
 eo.setUint32(12,cdLen,true); eo.setUint32(16,cdStart,true);
 return new Blob([...parts,...cd,new Uint8Array(eo.buffer)],{type:"application/zip"}); }
function doExport(){ const ts=new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
 const payload={labeler:S.labeler,exported_at:ts,demographics:S.demo,calibration:S.cal,task_order:S.order,answers:S.ans,version:"cpc-annotation-v1"};
 const zip=makeZip([[`results_${S.labeler}.json`,JSON.stringify(payload,null,1)],[`results_${S.labeler}.csv`,toCSV()],["README.txt",`CPC annotation results\nLabeler: ${S.labeler}\nExported: ${ts}\n请将本压缩包发送给研究者。`]]);
 const a=document.createElement("a"); a.href=URL.createObjectURL(zip); a.download=`cpc_annotation_${S.labeler}_${ts}.zip`; a.click(); }
/* ---------- 工具 ---------- */
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* ---------- 结构化日志渲染 ---------- */
function parseLog(log){ const evs=[]; let buf="";
 for(const line of (log||"").split("\n")){
  if(buf===""){ if(!line.trim()){continue;} if(!line.trim().startsWith("{")){ evs.push({ok:false,raw:line}); continue; } buf=line; }
  else buf+="\n"+line;
  try{ evs.push({ok:true,ev:JSON.parse(buf.trim())}); buf=""; }catch(e){ if(buf.length>200000){ evs.push({ok:false,raw:buf}); buf=""; } } }
 if(buf.trim()) evs.push({ok:false,raw:buf});
 return evs; }
function evHTML(e){
 if(!e.ok) return `<div class="ev ev-raw"><pre>${esc(e.raw)}</pre></div>`;
 const v=e.ev, ty=v.type;
 if(ty==="agent_thought"){ const tx=(v.text||"").trim(); if(!tx) return "";
  return `<details class="ev ev-th"><summary>💭 agent 内部思考(通常无需细读)</summary><pre>${esc(tx)}</pre></details>`; }
 if(ty==="agent_message") return `<div class="ev ev-msg"><div class="ev-tag">🤖 agent 发言</div><pre>${esc(v.text||"")}</pre></div>`;
 if(ty==="user_message") return `<details class="ev ev-user"><summary>📥 任务输入(与上方"任务说明"一致,点开可核对)</summary><pre>${esc(v.text||"")}</pre></details>`;
 if(ty==="tool_call"){ const texts=[]; (v.content||[]).forEach(c=>{const t=c&&c.content&&c.content.text; if(t) texts.push(t);});
  const desc=texts.length?texts[0]:(v.title||""); const outs=texts.slice(1);
  const st=v.status||""; const joined=outs.join("\n\n"); const big=joined.length>600;
  const body=outs.length?`<details class="ev-out"${big?"":" open"}><summary>命令输出${big?`(较长,共 ${joined.length} 字符,点开查看——这是证据的主要来源)`:""}</summary><pre>${esc(joined)}</pre></details>`:"";
  return `<div class="ev ev-tool"><div class="ev-tag">⚙️ ${esc(v.title||v.kind||"工具调用")} · ${esc(desc)}<span class="ev-st ${st==="completed"?"ok2":"warn2"}">${esc(st)}</span></div>${body}</div>`; }
 return `<details class="ev ev-oth"><summary>${esc(ty||"event")}</summary><pre>${esc(JSON.stringify(v,null,1))}</pre></details>`; }
function logView(log,key){ const evs=parseLog(log);
 if(!evs.some(x=>x.ok)) return `<div class="log">${esc(log)}</div>`;
 return `<div class="logbar"><button class="btn sec lbtn" id="tb_${key}" onclick="toggleRaw('${key}')">查看原始日志</button>
<button class="btn sec lbtn" onclick="expandAll('${key}',true)">展开全部</button>
<button class="btn sec lbtn" onclick="expandAll('${key}',false)">收起全部</button></div>
<div class="slog" id="sv_${key}">${evs.map(evHTML).join("")}</div>
<div class="log hide" id="rv_${key}">${esc(log)}</div>`; }
function toggleRaw(key){ const sv=document.getElementById("sv_"+key), rv=document.getElementById("rv_"+key), b=document.getElementById("tb_"+key);
 const showRaw=rv.classList.contains("hide"); rv.classList.toggle("hide",!showRaw); sv.classList.toggle("hide",showRaw);
 b.textContent=showRaw?"返回结构化视图":"查看原始日志"; }
function expandAll(key,open){ document.querySelectorAll("#sv_"+key+" details").forEach(d=>d.open=open); }
/* ---------- 启动 ---------- */
(async function(){ load(); MAN=await getJSON("data/manifest.json");
 if(S.step==="task"){ for(const t of S.order.slice(0,1)) await taskDoc(t); }
 if(S.step==="cal") CAL=await getJSON("data/calibration.json");
 render(); })();
</script>
